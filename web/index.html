<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IronFlow - Smart Fitness, Workout & Nutrition Tracking Companion.">
  
  <!-- Cross-Origin-Opener-Policy for Google Sign-In popup -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IronFlow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IronFlow - Fitness & Nutrition Tracking</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Google Sign-In Configuration for Web -->
  <meta name="google-signin-client_id" content="845707679691-jdat95ll1q9itnhchr6mtkuepobd46mh.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Anti-cache & Service Worker clean sweep for instant updates -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let r of registrations) {
          r.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let n of names) {
          caches.delete(n);
        }
      });
    }
  </script>

  <style>
    body {
      margin: 0;
      background-color: #12131A;
      color: #F4F4F8;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
