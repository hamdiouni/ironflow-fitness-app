name: flutter_secure_storage_web
description: Web implementation of flutter_secure_storage (Wasm-compatible dart:js_interop).
repository: https://github.com/mogol/flutter_secure_storage
version: 1.2.1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^1.1.1
  flutter_web_plugins:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FlutterSecureStorageWeb
        fileName: flutter_secure_storage_web.dart
