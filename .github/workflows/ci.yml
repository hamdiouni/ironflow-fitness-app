name: IronFlow CI & Security Gate

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Verify pre-commit secret guard script
        run: bash scripts/pre-commit-secrets-check.sh --ci-verify

  cloud-functions-proxy:
    name: AI Proxy Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Cloud Functions AI Proxy test suite
        run: node --test functions/test/ai_proxy.test.mjs

  flutter-verify:
    name: Flutter Analyze, Test, Web & Android Build
    runs-on: ubuntu-latest
    needs: [secret-scan, cloud-functions-proxy]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (fatal warnings)
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget test suite
        run: flutter test --no-pub

      - name: Build Web release
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug

  ios-compile-check:
    name: iOS Compile Check (No Codesign)
    runs-on: macos-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
