name: IronFlow CI, Quality & Release Gate

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Verify pre-commit secret guard script
        run: bash scripts/pre-commit-secrets-check.sh --ci-verify

  cloud-functions-proxy:
    name: AI Proxy Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Cloud Functions AI Proxy test suite
        run: node --test functions/test/ai_proxy.test.mjs

  flutter-verify:
    name: Flutter Analyze, Coverage Gate, Web & Android Build
    runs-on: ubuntu-latest
    needs: [secret-scan, cloud-functions-proxy]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter with pub cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dependency audit (outdated & discontinued check)
        run: flutter pub outdated --no-dev-dependencies

      - name: Static analysis (fatal warnings)
        run: flutter analyze --no-fatal-infos

      - name: Run unit, widget, golden & E2E journey tests with coverage
        run: flutter test --no-pub --coverage

      - name: Enforce per-layer coverage gate
        run: python3 scripts/check_coverage.py coverage/lcov.info

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

      - name: Build Web release (with build stamp)
        run: |
          flutter build web --release \
            --dart-define-from-file=config/production.json \
            --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Scan Web bundle for accidental non-Firebase API keys
        run: |
          ! grep -RInE "nvapi-[A-Za-z0-9_-]{20,}" build/web/

      - name: Upload Web release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironflow-web-release
          path: build/web/
          retention-days: 14

      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define-from-file=config/dev.json \
            --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Upload Android debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironflow-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  ios-compile-check:
    name: iOS Compile Check (No Codesign)
    runs-on: macos-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define-from-file=config/production.json \
            --dart-define=GIT_COMMIT=${{ github.sha }}
