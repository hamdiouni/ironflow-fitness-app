name: IronFlow CI, Quality & Release Gate

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Verify pre-commit secret guard script
        run: bash scripts/pre-commit-secrets-check.sh --ci-verify

  cloud-functions-proxy:
    name: Cloud Functions Build & AI Proxy Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - name: Install Cloud Functions dependencies
        run: npm ci
      - name: Build Cloud Functions TypeScript
        run: npm run build
      - name: Run Cloud Functions AI Proxy test suite
        run: npm test

  firebase-emulator-rules:
    name: Firestore & Storage Rules Emulator Tests
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - name: Install Firebase rules-unit-testing dependencies
        run: npm --prefix functions ci
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Execute Firestore & Storage rules tests against Emulator
        run: firebase emulators:exec --only firestore,storage "npm --prefix functions run test:rules"

  flutter-verify:
    name: Flutter Analyze, Coverage Ratchet, Web & Android Release Gate
    runs-on: ubuntu-latest
    needs: [secret-scan, cloud-functions-proxy, firebase-emulator-rules]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter with pub cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dependency audit (outdated & discontinued check)
        run: flutter pub outdated --no-dev-dependencies

      - name: Static analysis (fatal warnings)
        run: flutter analyze --no-fatal-infos

      - name: Run unit, widget, golden & E2E journey tests with coverage
        run: flutter test --no-pub --coverage --timeout=60s

      - name: Enforce coverage floors & monotonic ratchet
        run: python3 scripts/check_coverage.py coverage/lcov.info --baseline docs/quality/coverage_baseline.json --fail-on-drop

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

      - name: Build Web release (with build stamp)
        run: |
          flutter build web --release \
            --dart-define-from-file=config/production.json \
            --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Scan Web bundle for accidental non-Firebase API keys
        run: |
          ! grep -RInE "nvapi-[A-Za-z0-9_-]{20,}" build/web/

      - name: Upload Web release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironflow-web-release
          path: build/web/
          retention-days: 14

      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define-from-file=config/dev.json \
            --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Build Android release split APKs (R8 verified)
        env:
          ALLOW_UNSIGNED_RELEASE: "true"
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define-from-file=config/production.json \
            --dart-define=GIT_COMMIT=${{ github.sha }} \
            --dart-define=ALLOW_UNSIGNED_RELEASE=true

      - name: Verify R8 mapping.txt emitted
        run: test -s build/app/outputs/mapping/release/mapping.txt

      - name: Enforce performance, size, & R8 budgets (Wave 2.3 / Wave 5.1)
        run: python3 scripts/check_perf_budgets.py --require-release-apk --require-web --require-r8-mapping

      - name: Upload Android build & R8 mapping artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ironflow-android-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/mapping/release/mapping.txt
          retention-days: 14

      - name: Informational Web Wasm build (non-blocking)
        continue-on-error: true
        run: |
          flutter build web --wasm \
            --dart-define-from-file=config/production.json \
            --dart-define=GIT_COMMIT=${{ github.sha }} \
            -o "${{ github.workspace }}/build/web-wasm"

  ios-compile-check:
    name: iOS Compile Check (No Codesign)
    runs-on: macos-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define-from-file=config/production.json \
            --dart-define=GIT_COMMIT=${{ github.sha }}
