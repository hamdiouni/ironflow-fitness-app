# Build configuration for code generation
targets:
  $default:
    builders:
      freezed:
        enabled: true
        options:
          # Generate copyWith methods
          copy_with: true
          # Generate == and hashCode
          equal: true
          # Generate toString
          to_string: true
          # Generate map and when methods
          map: true
          # Generate union types
          union: true

      json_serializable:
        enabled: true
        options:
          # Generate fromJson factory
          any_map: false
          # Check for required fields
          checked: true
          # Create factory constructors
          create_factory: true
          # Create toJson method
          create_to_json: true
          # Disallow extra keys
          disallow_unrecognized_keys: false
          # Explicit toJson
          explicit_to_json: true
          # Field rename
          field_rename: none
          # Include if null
          include_if_null: true

      riverpod_generator:
        enabled: true
